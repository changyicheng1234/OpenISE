{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="card main-card animate-slideInUp">
        <div class="feature-intro">
            <div class="feature-icon-wrapper">
                <i class="fas fa-utensils"></i>
            </div>
            <h2>个性化食谱推荐</h2>
            <p class="intro-text">
                基于您的健康目标和饮食偏好，为您提供一日三餐的个性化推荐。
                我们会根据您的营养需求，确保每一餐都营养均衡，并符合您的口味习惯。
            </p>
        </div>
        <form id="recommendForm" class="styled-form">
            <div class="form-group">
                <label for="health_goal">您的健康目标</label>
                <div class="input-with-icon">
                    <i class="fas fa-bullseye"></i>
                    <input type="text" id="health_goal" required placeholder="如：减重、增肌、控制血糖等">
                </div>
            </div>
            <div class="form-group">
                <label for="dietary_preferences">饮食偏好</label>
                <div class="input-with-icon">
                    <i class="fas fa-heart"></i>
                    <input type="text" id="dietary_preferences" required placeholder="如：低脂、高蛋白、素食等">
                </div>
            </div>            <div class="form-group">
                <label for="lifestyle">生活习惯</label>
                <div class="input-with-icon textarea-icon">
                    <i class="fas fa-running"></i>
                    <textarea id="lifestyle" required placeholder="请描述您的生活习惯，包括运动、作息等"></textarea>
                </div>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn btn-primary btn-animated">
                    <i class="fas fa-magic"></i> 获取推荐
                </button>
            </div>
        </form>
        
        <!-- 添加加载动画 -->
        <div class="loading-container" id="loadingSpinner">
            <div class="loader loader-lg"></div>
            <p class="loading-text">正在为您生成个性化推荐...</p>
        </div>
    </div>    
    <div id="recommendResult" class="result-container animate-fadeIn" style="display: none;"></div>
</div>

<script>
document.getElementById('recommendForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const loadingSpinner = document.getElementById('loadingSpinner');
    const resultDiv = document.getElementById('recommendResult');
    
    // 显示加载动画
    form.style.opacity = '0.5';
    loadingSpinner.style.display = 'flex';
    resultDiv.style.display = 'none';
    
    const data = {
        health_goal: document.getElementById('health_goal').value,
        dietary_preferences: document.getElementById('dietary_preferences').value,
        lifestyle: document.getElementById('lifestyle').value
    };

    // 添加用户配置信息（如果存在）
    const userProfile = localStorage.getItem('userProfile');
    if (userProfile) {
        const profile = JSON.parse(userProfile);
        Object.assign(data, profile);
    }

    const healthStats = localStorage.getItem('healthStats');
    if (healthStats) {
        const stats = JSON.parse(healthStats);
        data.daily_calories = stats.daily_calories;
        data.daily_nutrition = stats.daily_nutrition;
        data.bmi = stats.bmi;
    }
    
    try {
        const response = await fetch('/recommend', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
          // 创建推荐结果HTML
        let recommendHtml = '<div class="recommendation-results">';
        
        // 添加总体概览
        recommendHtml += `
            <div class="overview-card animate-slideInUp">
                <div class="overview-header">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>饮食方案概览</h3>
                </div>
                <div class="overview-content">
                    <p><strong>健康目标:</strong> ${data.health_goal}</p>
                    <p><strong>饮食偏好:</strong> ${data.dietary_preferences}</p>
                    ${data.daily_calories ? `<p><strong>每日推荐摄入热量:</strong> ${data.daily_calories} 千卡</p>` : ''}
                </div>
            </div>
        `;
        
        // 处理三餐推荐
        recommendHtml += '<div class="meal-cards-grid">';
        
        // 为三餐添加不同的延迟动画效果
        const delays = ['delay-100', 'delay-200', 'delay-300'];
        let i = 0;
        
        ['早餐推荐', '午餐推荐', '晚餐推荐'].forEach(mealType => {
            const mealData = result[mealType];
            const delay = delays[i++];
            
            recommendHtml += `
                <div class="meal-card animate-slideInUp ${delay}">
                    <div class="meal-card-header">
                        <div class="meal-icon">
                            <i class="${mealType.includes('早餐') ? 'fas fa-coffee' : (mealType.includes('午餐') ? 'fas fa-hamburger' : 'fas fa-utensils')}"></i>
                        </div>
                        <h3>${mealType}</h3>
                    </div>
                    <div class="meal-card-content">
                        <div class="recommendation-section">
                            <h4><i class="fas fa-apple-alt"></i> 推荐食物</h4>
                            <ul class="food-list">
                                ${Array.isArray(mealData.推荐食物) ? 
                                    mealData.推荐食物.map(food => `<li><span class="food-item">${food}</span></li>`).join('') : 
                                    `<li><span class="food-item">${mealData.推荐食物 || '暂无推荐'}</span></li>`}
                            </ul>
                        </div>
                        <div class="recommendation-section">
                            <h4><i class="fas fa-chart-pie"></i> 营养价值</h4>
                            <p>${mealData.营养价值 || '暂无信息'}</p>
                        </div>
                        <div class="recommendation-section">
                            <h4><i class="fas fa-lightbulb"></i> 食用建议</h4>
                            <p>${mealData.食用建议 || '暂无建议'}</p>
                        </div>
                    </div>
                </div>
            `;
        });
        
        recommendHtml += '</div>'; // 关闭 meal-cards-grid
        
        // 添加营养建议
        if (result.营养建议) {
            recommendHtml += `
                <div class="nutrition-advice-card animate-slideInUp delay-400">
                    <div class="advice-card-header">
                        <i class="fas fa-leaf"></i>
                        <h3>营养建议</h3>
                    </div>
                    <div class="advice-card-content">
                        <p>${result.营养建议}</p>
                    </div>
                </div>
            `;
        }
        
        recommendHtml += '</div>'; // 关闭 recommendation-results
        
        // 显示结果
        resultDiv.innerHTML = recommendHtml;
        resultDiv.style.display = 'block';
        resultDiv.classList.add('fade-in');
        
        // 隐藏加载动画
        loadingSpinner.style.display = 'none';
        form.style.opacity = '1';
    } catch (error) {
        console.error('Error:', error);
        loadingSpinner.style.display = 'none';
        form.style.opacity = '1';
        alert('获取推荐失败，请稍后重试');
    }
});
</script>
{% endblock %}
