{% extends "base.html" %}

{% block content %}


<div class="container">
    <div class="card main-card animate-slideInUp">
        <div class="feature-intro">
            <div class="feature-icon-wrapper">
                <i class="fas fa-book-open"></i>
            </div>
            <h2>智能菜谱生成</h2>
            <p class="intro-text">
                输入想要制作的菜品名称，我们将为您生成详细的制作步骤和营养分析。
                结合您所在地区的特色，推荐最适合的烹饪方法和食材搭配。
            </p>
        </div>
        <form id="recipeForm" class="styled-form">
            <div class="form-group">
                <label for="recipe_name">菜品名称</label>
                <div class="input-with-icon">
                    <i class="fas fa-utensils"></i>
                    <input type="text" id="recipe_name" required placeholder="请输入想要制作的菜品名称">
                </div>
            </div>            <div class="form-group">
                <label for="location">所在地区</label>
                <div class="input-with-icon">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="location" required placeholder="请输入您的所在地区，以便推荐合适的食材">
                </div>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn btn-primary btn-animated">
                    <i class="fas fa-magic"></i> 生成菜谱
                </button>
            </div>
        </form>
        
        <!-- 添加加载动画 -->
        <div class="loading-container" id="loadingSpinner">
            <div class="loader loader-lg"></div>
            <p class="loading-text">正在生成菜谱详情...</p>
        </div>
    </div>
    
    <div id="recipe-result" class="recipe-card animate-fadeIn" style="display: none;">
        <div class="recipe-header">
            <h2 id="recipe-title"></h2>
            <div class="recipe-tags">
                <span class="recipe-tag" id="recipe-difficulty">难度适中</span>
                <span class="recipe-tag" id="recipe-time">30分钟</span>
                <span class="recipe-tag" id="recipe-calories">300千卡</span>
            </div>
        </div>
        
        <div class="recipe-content-grid">
            <div class="recipe-section ingredients-section animate-slideInUp delay-100">
                <div class="section-header">
                    <i class="fas fa-shopping-basket"></i>
                    <h3>所需食材</h3>
                </div>
                <ul id="ingredients-list" class="ingredients-list"></ul>
            </div>
            
            <div class="recipe-section steps-section animate-slideInUp delay-200">
                <div class="section-header">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>烹饪步骤</h3>
                </div>
                <ol id="cooking-steps" class="cooking-steps"></ol>
            </div>
        </div>
        
        <div class="recipe-section nutrition-section animate-slideInUp delay-300">
            <div class="section-header">
                <i class="fas fa-chart-pie"></i>
                <h3>营养分析</h3>
            </div>
            <div id="nutrition-info" class="nutrition-info"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('recipeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const loadingSpinner = document.getElementById('loadingSpinner');
    const resultDiv = document.getElementById('recipe-result');
    
    // 重置显示区域
    const ingredientsList = document.getElementById('ingredients-list');
    const cookingSteps = document.getElementById('cooking-steps');
    const nutritionInfo = document.getElementById('nutrition-info');
    const recipeTitle = document.getElementById('recipe-title');
    const recipeDifficulty = document.getElementById('recipe-difficulty');
    const recipeTime = document.getElementById('recipe-time');
    const recipeCalories = document.getElementById('recipe-calories');
    
    ingredientsList.innerHTML = '';
    cookingSteps.innerHTML = '';
    nutritionInfo.innerHTML = '';
    
    try {
        form.style.opacity = '0.5';
        loadingSpinner.style.display = 'flex';
        resultDiv.style.display = 'none';
        
        const recipeName = document.getElementById('recipe_name').value;
        const location = document.getElementById('location').value;
        
        const response = await fetch('/recipe', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                recipe_name: recipeName,
                location: location
            })
        });

        const result = await response.json();
        console.log('API返回数据:', result);

        if (result.error) {
            throw new Error(result.error);
        }
        
        // 设置菜谱标题和标签
        recipeTitle.textContent = result.recipe_name || recipeName;
        
        // 设置难度、时间和热量标签（如果有返回值的话）
        if (result.difficulty) {
            recipeDifficulty.textContent = `难度：${result.difficulty}`;
        }
        
        if (result.cooking_time) {
            recipeTime.textContent = `时间：${result.cooking_time}`;
        }
        
        if (result.calories) {
            recipeCalories.textContent = `热量：${result.calories}`;
        }        // 更新食材列表
        if (Array.isArray(result.ingredients_list) && result.ingredients_list.length > 0) {
            ingredientsList.innerHTML = result.ingredients_list
                .map(ingredient => {
                    if (typeof ingredient === 'string') {
                        return `<li class="ingredient-item"><span class="ingredient-name">${ingredient}</span></li>`;
                    }
                    const name = ingredient.item_name || ingredient.name || '';
                    const quantity = ingredient.quantity || ingredient.amount || '';
                    return `<li class="ingredient-item">
                        <span class="ingredient-name">${name}</span>
                        <span class="ingredient-amount">${quantity}</span>
                    </li>`;
                })
                .join('');
        } else {
            ingredientsList.innerHTML = '<li class="no-data">暂无食材数据</li>';
        }

        // 更新烹饪步骤
        if (result.cooking_process) {
            let steps;
            if (typeof result.cooking_process === 'string') {
                // 处理包含"步骤"或"："的文本
                steps = result.cooking_process
                    .split(/[：:、。]/g)  // 按标点符号分割
                    .filter(step => {
                        const trimmed = step.trim();
                        return trimmed && !trimmed.includes('以下是') && !trimmed.includes('烹饪步骤');
                    })
                    .map(step => step.trim());
            } else if (Array.isArray(result.cooking_process)) {
                steps = result.cooking_process;
            } else {
                steps = [];
            }
            
            cookingSteps.innerHTML = steps.length > 0 
                ? steps
                    .map((step, index) => `<li class="step-item">
                        <div class="step-number">${index + 1}</div>
                        <div class="step-content">${step}</div>
                    </li>`)
                    .join('')
                : '<li class="no-data">暂无烹饪步骤</li>';
        } else {
            cookingSteps.innerHTML = '<li class="no-data">暂无烹饪步骤</li>';
        }        // 更新营养分析
        const nutrition = result.nutritional_analysis;
        if (nutrition) {
            let nutritionHtml = '<div class="nutrition-grid">';
            
            if (typeof nutrition === 'string') {
                // 处理字符串格式的营养信息
                const nutritionLines = nutrition
                    .split(/\n/)
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('营养分析'));
                
                // 尝试提取主要营养素
                const mainNutrients = {
                    '热量': { icon: 'fa-fire', unit: '千卡', value: '' },
                    '蛋白质': { icon: 'fa-drumstick-bite', unit: '克', value: '' },
                    '脂肪': { icon: 'fa-oil-can', unit: '克', value: '' },
                    '碳水化合物': { icon: 'fa-bread-slice', unit: '克', value: '' }
                };
                
                nutritionLines.forEach(line => {
                    const match = line.match(/(.*?)[:：](.*)/);
                    if (match) {
                        const [, label, value] = match;
                        const nutrientName = label.trim();
                        
                        // 检查是否是主要营养素
                        for (const key in mainNutrients) {
                            if (nutrientName.includes(key)) {
                                // 提取数字
                                const numMatch = value.match(/\d+(\.\d+)?/);
                                if (numMatch) {
                                    mainNutrients[key].value = numMatch[0];
                                } else {
                                    mainNutrients[key].value = value.trim();
                                }
                                break;
                            }
                        }
                    }
                });
                
                // 生成主要营养素卡片
                Object.entries(mainNutrients).forEach(([name, data]) => {
                    nutritionHtml += `
                        <div class="nutrient-card">
                            <div class="nutrient-icon">
                                <i class="fas ${data.icon}"></i>
                            </div>
                            <div class="nutrient-value">${data.value || '未知'}</div>
                            <div class="nutrient-name">${name} ${data.unit}</div>
                        </div>
                    `;
                });
                
                nutritionHtml += '</div><div class="nutrition-details">';
                
                // 添加所有营养信息
                nutritionLines.forEach(line => {
                    const match = line.match(/(.*?)[:：](.*)/);
                    if (match) {
                        const [, label, value] = match;
                        nutritionHtml += `
                            <div class="nutrition-item">
                                <span class="nutrition-label">${label.trim()}</span>
                                <span class="nutrition-value">${value.trim()}</span>
                            </div>
                        `;
                    } else {
                        nutritionHtml += `<p>${line}</p>`;
                    }
                });
                
            } else if (typeof nutrition === 'object') {
                const items = {
                    calories: { name: '热量', icon: 'fa-fire', unit: '千卡' },
                    protein: { name: '蛋白质', icon: 'fa-drumstick-bite', unit: '克' },
                    fat: { name: '脂肪', icon: 'fa-oil-can', unit: '克' },
                    carbs: { name: '碳水化合物', icon: 'fa-bread-slice', unit: '克' }
                };
                
                // 生成主要营养素卡片
                Object.entries(items).forEach(([key, data]) => {
                    if (key in nutrition) {
                        const value = nutrition[key];
                        let displayValue = value;
                        
                        // 如果值是字符串且包含数字，则保留数字部分
                        if (typeof value === 'string') {
                            const numMatch = value.match(/\d+(\.\d+)?/);
                            if (numMatch) {
                                displayValue = numMatch[0];
                            }
                        }
                        
                        nutritionHtml += `
                            <div class="nutrient-card">
                                <div class="nutrient-icon">
                                    <i class="fas ${data.icon}"></i>
                                </div>
                                <div class="nutrient-value">${displayValue}</div>
                                <div class="nutrient-name">${data.name} ${data.unit}</div>
                            </div>
                        `;
                    }
                });
                
                nutritionHtml += '</div><div class="nutrition-details">';
                
                // 添加所有营养信息
                Object.entries(nutrition).forEach(([key, value]) => {
                    const knownNutrient = items[key];
                    if (!knownNutrient) {
                        nutritionHtml += `
                            <div class="nutrition-item">
                                <span class="nutrition-label">${key}</span>
                                <span class="nutrition-value">${value}</span>
                            </div>
                        `;
                    }
                });
            }
            
            nutritionHtml += '</div>';
            nutritionInfo.innerHTML = nutritionHtml || '<p class="no-data">暂无营养数据</p>';
        } else {
            nutritionInfo.innerHTML = '<p class="no-data">暂无营养数据</p>';
        }        resultDiv.style.display = 'block';
        
        // 平滑滚动到结果
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // 恢复表单样式
        form.style.opacity = '1';
        loadingSpinner.style.display = 'none';
        
        // 添加动画触发
        setTimeout(() => {
            const animElements = document.querySelectorAll('.animate-slideInUp, .animate-fadeIn');
            animElements.forEach(el => {
                el.classList.add('active');
            });
        }, 100);
        
    } catch (error) {
        console.error('生成菜谱失败:', error);
        
        // 错误提示
        const errorHtml = `
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <p>生成菜谱失败，请稍后重试</p>
                <small>${error.message}</small>
            </div>
        `;
        
        document.getElementById('recipe-title').textContent = '出错了';
        document.getElementById('ingredients-list').innerHTML = errorHtml;
        document.getElementById('cooking-steps').innerHTML = '';
        document.getElementById('nutrition-info').innerHTML = '';
        
        // 显示结果区域，但只显示错误信息
        resultDiv.style.display = 'block';
        
        // 恢复表单样式
        form.style.opacity = '1';
        loadingSpinner.style.display = 'none';
    }
});
</script>
{% endblock %}
